<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Schuldenkompass</title>
  <meta name="description" content="Behalte Einkommen, Fixkosten und Schulden im Blick — mit einem klaren Tilgungsplan bis zur Schuldenfreiheit." />

  <!-- PWA / iOS Home-Screen -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#14181C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kompass" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-header__title">
        <span class="app-header__icon" aria-hidden="true">⟡</span>
        <span>Schuldenkompass</span>
      </div>
      <button class="icon-btn" id="settings-btn" aria-label="Einstellungen öffnen" title="Einstellungen">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M19.4 13a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V19a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.04-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 13a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 6.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 2.6a1.7 1.7 0 0 0 1.04-1.56V1a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 2.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 6.6c.14.42.5.8 1.56.83a1.7 1.7 0 0 1 1.56 1.04H23a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 13Z" opacity="0"/>
        </svg>
      </button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation">
      <button class="tabbar__item" data-tab="cockpit">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span>Cockpit</span>
      </button>
      <button class="tabbar__item" data-tab="income">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v18M17 7.5c0-1.9-2.2-3-5-3s-5 1.2-5 3 2.2 2.6 5 3 5 1.1 5 3-2.2 3-5 3-5-1.1-5-3"/></svg>
        <span>Einkommen</span>
      </button>
      <button class="tabbar__item" data-tab="fixedCosts">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span>Fixkosten</span>
      </button>
      <button class="tabbar__item" data-tab="debts">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10.5h19M6 15h4"/></svg>
        <span>Schulden</span>
      </button>
      <button class="tabbar__item" data-tab="plan">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V9M11 19V5M18 19v-7"/></svg>
        <span>Plan</span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>

  <script src="js/app.js"></script>
</body>
</html>
